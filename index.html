 별자리 땅따먹기 — 3~6학년 교과 연계 상식 복습 게임 (단일 HTML, 인터넷 없이 실행)

 [아트 바이블]
 1 빛: 오른쪽 위 달빛(차가운 #CFE3FF, 40°) + 별 자체의 따뜻한 금빛(#FFD98A) 보조광.
 2 외곽선: 앞 물체(캐릭터·놋쇠 UI·두루마리·망원경) 3px, 같은 색 계열의 가장 진한 색. 배경 산·구름은 외곽선 없음.
 3 음영: 바탕·그늘·빛 3단. 그늘은 보라 쪽(hue +30°, 예: 호박색 #C9773A → 그늘 #8A4C5E), 빛은 달빛 쪽 차가운 크림.
 4 팔레트: 주조 남보라 #1B1F5C / 보조 놋쇠 금 #E2B04A, 청록 #3FB8B0 / 강조 별빛 #FFE27A / 그늘 #2A1E4A.
   밤마다 하늘색만 바뀐다(초승달=보라, 반달=청록 오로라, 보름달=노을 자주).
 5 질감: 하늘은 성운 붓자국(반투명 원 겹치기), 두루마리·일지는 종이결(가는 가로 줄무늬), 놋쇠는 띠 모양 반사광.
 6 깊이 층(시차 배율): ①하늘·성운 0.01 ②반짝이는 별 0.02 ③먼 산(하늘색 40% 섞기) 0.04 ④언덕·천문대·마을 0.07
                       ⑤별자리 판(놋쇠 성도판, 무대) 0 ⑥누리·나뭇가지 0.10 ⑦흐린 전경 나뭇잎 0.16
 7 글꼴: 나눔스퀘어라운드 ExtraBold(OFL, 쓰는 글자만 서브셋 내장) — 제목은 4겹 입체(놋쇠 두께+남색 외곽선 7px),
   HUD 숫자 5px 외곽선, 본문은 같은 글꼴. 기호(① × ·)도 같은 글꼴에 있음.
 8 UI 재질: 놋쇠 천문 계기(톱니 테두리·나사 머리·띠 반사광) + 양피지 두루마리 + 가죽 관측 일지.
 9 캐릭터: 별지기 부엉이 「누리」 2.5등신(화면 높이 30%), 표정 5종(보통·기쁨·걱정·놀람·생각), 숨쉬기·깜빡임·날개 퍼덕·깡충.
    상대 먹구름 「꾸물」 표정 5종(보통·신남·시무룩·놀람·생각·졸림), 둥실 떠다님, 번개 꼬리 흔들림.
 10 움직이는 것: 반짝이는 별, 별똥별, 흐르는 구름, 반딧불, 천문대 창 불빛, 아이콘 단추 흔들림, 누리 숨쉬기·깜빡임,
    꾸물 둥실, 오로라(반달 밤). 저사양: 입자 1/3, 큰 빛 번짐 70%, 흐린 전경 끔, 해상도 배율 1. 구도·그림체·층 수는 그대로.

html,body{margin:0;height:100%;overflow:hidden;background:#0B0F2E;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#cv{display:block;touch-action:none;position:absolute;left:0;top:0}
:root{--font:'StarRound','NanumSquareRound','Apple SD Gothic Neo',sans-serif;--ink:#3B2416;--brass:#E2B04A}
.hide{display:none!important}
/* ---------- 양피지 두루마리 (문제) ---------- */
#scroll{position:absolute;display:none;box-sizing:border-box;padding:2.4vh 30px 2vh;
  font-family:var(--font);font-weight:800;color:var(--ink);
  background:repeating-linear-gradient(0deg,rgba(120,80,40,.05) 0 2px,transparent 2px 5px),
    radial-gradient(120% 90% at 70% 20%,#FFF4D6 0%,#F4DEAA 55%,#D9B47A 100%);
  border:3px solid #6B3F22;border-radius:6px;
  box-shadow:0 10px 0 -2px rgba(42,30,74,.55),inset 0 0 0 3px rgba(255,248,225,.55),inset 0 -14px 24px rgba(140,80,60,.25);
  transform-origin:50% 0;pointer-events:none;z-index:3}
#scroll:before,#scroll:after{content:"";position:absolute;left:-16px;right:-16px;height:18px;border-radius:9px;border:3px solid #4A2A16;
  background:linear-gradient(180deg,#F5CE6A 0%,#E2B04A 35%,#9C6A24 80%,#6B4314 100%)}
#scroll:before{top:-14px}#scroll:after{bottom:-14px}
#scroll .tag{display:inline-flex;align-items:center;gap:6px;font-size:clamp(14px,2vh,18px);color:#FFF6DA;padding:2px 12px 2px 5px;border-radius:14px;border:2px solid #2A1E4A;margin-bottom:.8vh}
#scroll .tag canvas{width:24px;height:24px}
#scroll .q{font-size:clamp(17px,3.3vh,31px);line-height:1.38;overflow-wrap:anywhere;word-break:keep-all}
#scroll .hint{margin-top:1vh;font-size:clamp(14px,2.3vh,21px);color:#7A2E3A;line-height:1.4;display:none;border-top:2px dashed rgba(107,63,34,.45);padding-top:.8vh;word-break:keep-all;overflow-wrap:anywhere}
#scroll .hint b{color:#2C5F7C}
#scroll .help{margin-top:.8vh;font-size:clamp(12px,1.8vh,16px);color:#7C5A3A}
/* ---------- 가죽 관측 일지 (이름 쓰기) ---------- */
.journal{position:absolute;box-sizing:border-box;font-family:var(--font);font-weight:800;color:var(--ink);z-index:4;
  background:repeating-linear-gradient(0deg,transparent 0 37px,rgba(70,110,160,.28) 37px 39px),
    radial-gradient(130% 100% at 80% 10%,#FFF6DC 0%,#F2DCA8 60%,#DDBA80 100%);
  border-left:22px solid #6A2E2E;border-radius:4px 10px 10px 4px;
  box-shadow:-3px 0 0 #3E1818,0 14px 0 -4px rgba(20,12,40,.55),inset 0 0 0 2px rgba(255,248,225,.6),inset 14px 0 18px -10px rgba(80,30,20,.45)}
#nameBook{width:min(460px,46vw);padding:26px 30px 22px 34px;transform:rotate(-2deg)}
#nameBook h2{margin:0 0 4px;font-size:clamp(20px,3.4vh,30px);color:#5A2C2C;letter-spacing:1px}
#nameBook .sub{font-size:clamp(13px,2vh,17px);color:#7C5A3A;margin-bottom:12px}
#nameBook label{display:block;font-size:clamp(15px,2.3vh,20px);color:#2C5F7C;margin-top:6px}
#nameInput{font:inherit;font-size:clamp(24px,4.4vh,40px);color:#1E2766;width:100%;box-sizing:border-box;background:transparent;border:0;outline:0;
  border-bottom:3px solid rgba(44,95,124,.55);padding:4px 2px;-webkit-user-select:text;user-select:text}
#nameInput::placeholder{color:rgba(60,40,30,.32)}
#nameRow{display:flex;align-items:flex-end;gap:16px}
#stamp{flex:none;width:88px;height:88px;border-radius:50%;border:0;cursor:pointer;font:inherit;font-size:20px;color:#FFE9D6;line-height:1.05;
  background:radial-gradient(circle at 62% 32%,#E06A5A 0%,#B8352C 55%,#7A1C1C 100%);box-shadow:0 6px 0 #4A1010,inset 0 0 0 4px rgba(255,200,180,.35),inset 0 0 0 9px rgba(122,28,28,.6);
  text-shadow:0 2px 0 #5A1414;transform:rotate(8deg);transition:transform .08s}
#stamp:active{transform:rotate(8deg) translateY(4px) scale(.96);box-shadow:0 2px 0 #4A1010,inset 0 0 0 4px rgba(255,200,180,.35)}
#nameWarn{min-height:22px;font-size:16px;color:#A0303A;margin-top:6px}
/* ---------- 결과 · 오답 노트 (펼친 일지) ---------- */
#book{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none}
#bookInner{pointer-events:auto;display:flex;width:min(1180px,94vw);height:min(720px,88vh);transform:rotate(-1deg);position:relative;
  filter:drop-shadow(0 16px 0 rgba(20,12,40,.55))}
.page{flex:1;box-sizing:border-box;padding:3.2vh 2.6vw;font-family:var(--font);font-weight:800;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;
  background:repeating-linear-gradient(0deg,rgba(120,80,40,.05) 0 2px,transparent 2px 6px),radial-gradient(120% 100% at 50% 0%,#FFF6DC 0%,#F2DCA8 65%,#D8B47A 100%)}
.page.l{border-radius:14px 0 0 14px;border:4px solid #6A2E2E;border-right:0;box-shadow:inset -30px 0 30px -24px rgba(90,50,30,.55)}
.page.r{border-radius:0 14px 14px 0;border:4px solid #6A2E2E;border-left:0;box-shadow:inset 30px 0 30px -24px rgba(90,50,30,.55)}
#ribbon{position:absolute;left:calc(50% - 14px);top:-14px;width:28px;height:90px;background:linear-gradient(90deg,#2E8E88,#3FB8B0 50%,#22706A);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.page h2{margin:0 0 .6vh;font-size:clamp(22px,4vh,36px);color:#5A2C2C}
.page h3{margin:1.2vh 0 .6vh;font-size:clamp(16px,2.6vh,22px);color:#2C5F7C}
.page .lead{font-size:clamp(14px,2.2vh,19px);color:#7C5A3A;margin-bottom:1vh;word-break:keep-all}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1vw}
.stat{display:flex;align-items:center;gap:10px;padding:.8vh 10px;border-radius:10px;background:rgba(255,250,235,.55);border:2px solid rgba(107,63,34,.35)}
.stat canvas{width:42px;height:42px;flex:none}
.stat .v{font-size:clamp(20px,3.6vh,32px);color:#1E2766;line-height:1}
.stat .k{font-size:clamp(12px,1.8vh,15px);color:#7C5A3A}
.nights{display:flex;gap:8px;margin-top:1vh}
.nightChip{flex:1;text-align:center;padding:.6vh 4px;border-radius:10px;border:2px solid rgba(107,63,34,.4);font-size:clamp(12px,1.9vh,16px);background:rgba(255,250,235,.5)}
.nightChip b{display:block;font-size:clamp(15px,2.5vh,21px);color:#1E2766}
.found{display:flex;flex-wrap:wrap;gap:6px;margin-top:.6vh}
.found canvas{width:56px;height:56px;border-radius:8px;background:#1B1F5C;border:2px solid #8A5A1C}
.note{flex:1;overflow-y:auto;padding-right:6px;-webkit-overflow-scrolling:touch}
.note::-webkit-scrollbar{width:10px}.note::-webkit-scrollbar-thumb{background:#B98A4A;border-radius:6px}
.nItem{border-bottom:2px dashed rgba(107,63,34,.35);padding:1vh 2px;font-size:clamp(13px,2.05vh,18px);line-height:1.45;overflow-wrap:anywhere;word-break:keep-all}
.nItem .nq{color:#2A1E4A}
.nItem .src{display:inline-block;font-size:.8em;color:#FFF6DA;background:#8A5A1C;border-radius:8px;padding:0 7px;margin-right:6px}
.nItem .mine{color:#A0303A}.nItem .ans{color:#1E7A5A}.nItem .exp{color:#5A4A6A;font-size:.92em}
.empty{font-size:clamp(15px,2.4vh,20px);color:#1E7A5A;margin-top:2vh}
.btnRow{display:flex;gap:12px;justify-content:flex-end;margin-top:1.2vh;flex-wrap:wrap}
.brassBtn{font:inherit;font-weight:800;font-size:clamp(15px,2.4vh,21px);color:#FFF6DA;cursor:pointer;min-height:48px;padding:6px 22px;border-radius:24px;
  border:3px solid #4A2A10;background:linear-gradient(180deg,#FFE7A0 0%,#E2B04A 38%,#9C6A24 85%);
  text-shadow:-2px 0 #4A2A10,2px 0 #4A2A10,0 -2px #4A2A10,0 2px #4A2A10,0 3px #4A2A10;box-shadow:0 5px 0 #4A2A10,inset 0 2px 0 rgba(255,255,255,.6)}
.brassBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #4A2A10}
.brassBtn.teal{background:linear-gradient(180deg,#9FF0E6 0%,#3FB8B0 40%,#1E6E68 90%)}
/* ---------- 도감 ---------- */
#atlas .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1vh 1vw;flex:1;align-content:start}
#atlas .cell{text-align:center;font-size:clamp(12px,1.9vh,16px)}
#atlas .cell canvas{width:100%;max-width:120px;aspect-ratio:1;border-radius:10px;background:#1B1F5C;border:3px solid #8A5A1C;display:block;margin:0 auto 3px}
/* ---------- 설정 (놋쇠 판) ---------- */
#settings{position:absolute;z-index:6;right:16px;width:300px;box-sizing:border-box;padding:16px 18px 14px;font-family:var(--font);font-weight:800;color:#FFF6DA;
  border-radius:18px;border:4px solid #4A2A10;background:radial-gradient(130% 120% at 80% 0%,#5A4A8A 0%,#3B2A5C 60%,#2A1E4A 100%);
  box-shadow:0 10px 0 -2px rgba(20,12,40,.6),inset 0 0 0 4px #C9963A,inset 0 0 0 7px #4A2A10}
#settings h3{margin:0 0 8px;font-size:20px;color:#FFE27A}
.sw{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:18px;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .knob{width:62px;height:32px;border-radius:16px;background:#1A1238;border:3px solid #C9963A;position:relative;flex:none;transition:background .15s}
.sw .knob:after{content:"";position:absolute;top:2px;left:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#FFE7A0,#9C6A24);border:2px solid #4A2A10;transition:left .15s}
.sw input:checked+.knob{background:#2E8E88}.sw input:checked+.knob:after{left:31px}
#resetBtn{margin-top:8px;width:100%}

#testBox{position:absolute;left:12px;top:12px;bottom:12px;width:min(760px,92vw);overflow:auto;z-index:20;font:13px/1.35 monospace;color:#fff;border-radius:10px;padding:12px 16px;box-sizing:border-box}

  if (id.indexOf('night') === 0) { const n = +id.slice(5); if (n >= SAVE.unlocked) { SFX.wrong(); say('앞의 밤을 먼저 지켜야 열려요', 1.8); G.owl.mood = 'worried'; return; }

}

function demoBoard(n) {

  const take = (type, c, r, w) => { const e = edgeOf(type, c, r); if (e) { e.owner = w; e.t = 1; } };
  take('v', 1, 0, 'p'); take('h', 0, 1, 'r');
  const b0 = R.boxes.find(b => b.c === 0 && b.r === 0); b0.owner = 'p'; b0.anim = 1.5; R.stats.found.push(b0.pat);
  take('v', 3, 0, 'p'); take('h', 3, 1, 'r'); const b3 = R.boxes.find(b => b.c === 3 && b.r === 0); b3.owner = 'r'; b3.anim = 1.5;
  take('h', 1, 1, 'p'); take('v', 1, 1, 'r'); take('h', 1, 2, 'p'); take('v', 2, 2, 'r'); take('h', 2, 2, 'r'); take('v', 3, 2, 'p'); take('h', 2, 1, 'p');

}

  }
